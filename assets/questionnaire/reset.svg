<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Manipulation check: the garden is put back, nobody sees what was placed -->
  <rect width="160" height="100" rx="8" fill="#7fb069"/>
  <!-- placed things, fading -->
  <g opacity="0.35">
    <g transform="translate(34 46)"><rect x="-3" y="0" width="6" height="18" fill="#5c8a3c"/><circle cy="-2" r="8" fill="#e5533c"/></g>
    <g transform="translate(60 56)"><rect x="-3" y="0" width="6" height="18" fill="#5c8a3c"/><circle cy="-2" r="8" fill="#f2c94c"/></g>
    <g transform="translate(96 60)"><rect x="-18" y="-4" width="36" height="7" rx="2" fill="#8a5a2b"/><rect x="-16" y="3" width="4" height="12" fill="#8a5a2b"/><rect x="12" y="3" width="4" height="12" fill="#8a5a2b"/></g>
    <g transform="translate(122 44)"><rect x="-2" y="0" width="4" height="26" fill="#3b2a14"/><rect x="-7" y="-10" width="14" height="12" rx="2" fill="#f2c94c"/></g>
  </g>
  <!-- circular arrow: back to the start -->
  <g transform="translate(80 36)" fill="none" stroke="#3b2a14" stroke-width="4" stroke-linecap="round">
    <path d="M14 -6 A16 16 0 1 0 14 8"/>
    <path d="M8 -12 L14 -6 L8 0"/>
  </g>
  <!-- crossed eye: nobody sees it -->
  <g transform="translate(134 90)">
    <path d="M-16 0 Q0 -11 16 0 Q0 11 -16 0 Z" fill="#ffffff" stroke="#3b2a14" stroke-width="2"/>
    <circle r="4.5" fill="#3b2a14"/>
    <line x1="-18" y1="12" x2="18" y2="-12" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
