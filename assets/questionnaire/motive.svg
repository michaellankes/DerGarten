<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <!-- Motive question: what "on the lawn" means – the things around the bed, not the vegetables in it -->
  <rect width="240" height="100" rx="8" fill="#7fb069"/>
  <!-- the bed in the middle, greyed out -->
  <g opacity="0.45">
    <rect x="86" y="22" width="68" height="56" rx="3" fill="#8a5a2b"/>
    <g fill="#6e4a24">
      <rect x="90" y="26" width="18" height="15"/><rect x="111" y="26" width="18" height="15"/><rect x="132" y="26" width="18" height="15"/>
      <rect x="90" y="43" width="18" height="15"/><rect x="111" y="43" width="18" height="15"/><rect x="132" y="43" width="18" height="15"/>
      <rect x="90" y="60" width="18" height="15"/><rect x="111" y="60" width="18" height="15"/><rect x="132" y="60" width="18" height="15"/>
    </g>
    <g fill="#9ccc65"><circle cx="99" cy="33" r="4"/><circle cx="120" cy="50" r="4"/><circle cx="141" cy="67" r="4"/></g>
  </g>
  <!-- things on the lawn, highlighted with a dashed ring each -->
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" fill="none">
    <circle cx="36" cy="34" r="17"/><circle cx="42" cy="74" r="16"/><circle cx="196" cy="34" r="17"/><circle cx="196" cy="74" r="18"/>
  </g>
  <g transform="translate(30 36)"><rect x="-3" y="0" width="6" height="14" fill="#5c8a3c"/><circle cy="-2" r="7" fill="#e5533c"/></g>
  <g transform="translate(44 36)"><rect x="-3" y="0" width="6" height="14" fill="#5c8a3c"/><circle cy="-2" r="7" fill="#f2c94c"/></g>
  <g transform="translate(42 74)"><rect x="-14" y="-3" width="28" height="6" rx="2" fill="#8a5a2b"/><rect x="-12" y="3" width="4" height="9" fill="#8a5a2b"/><rect x="8" y="3" width="4" height="9" fill="#8a5a2b"/></g>
  <g transform="translate(196 30)"><rect x="-2" y="0" width="4" height="20" fill="#3b2a14"/><rect x="-6" y="-9" width="12" height="10" rx="2" fill="#f2c94c"/></g>
  <g transform="translate(196 74)"><circle r="12" fill="#5c8a3c"/><circle cx="-4" cy="-3" r="2.5" fill="#f2c94c"/><circle cx="5" cy="2" r="2.5" fill="#e5533c"/></g>
</svg>
